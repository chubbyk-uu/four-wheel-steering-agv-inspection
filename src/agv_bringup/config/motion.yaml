swerve_controller:
  ros__parameters:
    # Provisional control policy; all angular values are radians.
    command_timeout: 0.4
    reorient_angle: 0.30
    aligned_angle: 0.035
    stopped_speed: 0.025
    alignment_motion_confirm_s: 0.06
    max_lateral_mismatch: 0.12
    # Reserve is measured from whichever software command limit the wheel is
    # turning toward: (hard - soft) + 3 deg = 8 deg of mechanical reserve on
    # each side, unchanged by moving the span off centre to [-280, +100] deg.
    steering_limit_reserve: 0.05235987755982989
    # Travel a stopped vehicle must leave before it starts a segment. Parking
    # a branch 5 deg from the soft limit, which the 8 deg mechanical reserve
    # permits, cost a 100 m pass a 180 deg reconfiguration 15 mm from its end:
    # the tracker's cross-track correction alone may swing a wheel by
    # atan(cross_command_ratio) = 11.3 deg on top of the 3 deg dynamic reserve.
    # Some direction always owns a branch beside a limit whatever the placement
    # -- now it is lateral +90 deg, not straight ahead -- so this stays. 20 deg
    # refuses that branch while leaving ordinary stopped choices free; a wheel
    # is still allowed within 20 deg of the limit while driving.
    steering_segment_margin: 0.3490658503988659
    wheel_speed_deadband: 0.005
