# Large AGV baseline. Geometry not supplied by user is an engineering estimate.
wheelbase: 1.3
track: 0.94
wheel_radius: 0.2
wheel_width: 0.16
body_length: 1.9
body_width: 1.1
mass: 550.0
# Steering travel is 380 deg but it is not centred on straight ahead. Direction is
# periodic modulo 180 deg, so the span fixes the guaranteed margin -- 380 >= 180+2m
# gives m = 100 deg either way it is placed -- and the placement only decides which
# direction is stuck with the branch beside a limit. Symmetric +-190 deg put that
# branch on straight ahead (180 deg, 10 deg of margin), held for a whole 110 s pass;
# [-280, +100] leaves it on lateral +90 deg instead, which is held only in transfers.
# All four corners share one pair: rotation splits the wheels by diagonal and lateral
# motion wants all four at one angle, so no left/right mirror matches either.
steer_hard_lower: -4.886921905584122
steer_hard_upper: 1.7453292519943295
steer_soft_lower: -4.799655442984406
steer_soft_upper: 1.6580627893946132
steer_rate: 0.65
steer_accel: 1.5
# Vehicle top speed (15 km/h). This bounds the controller, the drive joints and
# the sensor's "impossible wheel speed" guard -- it is what the machine can do,
# not what a scan asks for. A scan commanded at the top speed would leave the
# tracker no authority to accelerate, so the two must stay separate. The measured
# feedback demand only proves the top speed must exceed the rated 10 km/h; 15 is
# engineering rounding above that, not a derived figure. The derived ceiling on
# scan speed is lower and belongs to the sensor: 11 kHz at 0.3662 mm per line is
# 4.028 m/s (14.5 km/h).
max_speed: 4.166666666666667
# Rated inspection speed (10 km/h): the fastest scan a mission may request.
# Line rate at this speed is 7585 Hz against the 11 kHz sampling bench result.
rated_scan_speed: 2.777777777777778
max_yaw_rate: 0.35
# Shared by the wheel allocator and mission tracker.
max_lateral_speed: 1.0
drive_accel: 0.8
drive_decel: 1.0
# Time-profile braking reserves actuator authority for feedback; physical limit stays 1.0.
trajectory_decel: 0.8
base_height: 0.65
body_top_height: 1.1
# Provisional peak actuator/holding torque, not a measured continuous motor rating.
# 150 Nm allowed passive rolling during loaded steering; 300 Nm holds in the flat-road probe.
drive_effort: 300.0
steer_effort: 180.0
# Provisional 550 kg response fit: sustained pitch ~1.2/1.5 deg at +0.8/-1 m/s2.
# Separate axle references retain loaded ride height; these are joint reference
# positions of a preloaded effective spring, not extra mechanical travel.
suspension_stiffness: 8000.0
suspension_damping: 750.0
suspension_preload: -0.141208364106175
suspension_preload_front: -0.1330988637734549
suspension_preload_rear: -0.13034084459464826
suspension_travel: 0.05
gnss_baseline: 1.1
gnss_top_height: 1.2
