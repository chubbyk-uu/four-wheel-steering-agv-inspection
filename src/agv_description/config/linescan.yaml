# Nominal prototype optics, NOT a selected physical camera / lens.
width: 4096
# Overscan/oversampling guard for the C++ renderer's distorted ray mapping.
render_width: 5120
# Lines per image; default full block is 4096 x 4096. A stopped scan keeps its short tail.
block_rows: 4096
# Partial images below this count are omitted; metadata events retain the gap.
min_tail_rows: 1000
# Add sparse anchors on both sides of long actual inter-line intervals.
pose_tag_time_gap_s: 0.1
# Display-only sRGB transfer for linear OptiX / radiometric CUDA previews.
# Raw Mono8, archived PGM and offline correction stay linear.
preview_srgb: true
preview_bin: 8
pixel_pitch_m: 0.000007
focal_length_m: 0.020
nominal_width_m: 1.5
# Nominal longitudinal interpretation, derived from calibrated 0.4 m wheel.
# The C++ plugin derives this from wheel_encoder + platform.wheel_radius.
line_spacing_m: 0.0003657010198319368
wheel_encoder:
  wheel: fl
  ppr: 2000
  decode: 4
  multiplier: 64
  divider: 149
# Signed position frontier (PositionUp/Down): no new lines while retracing.
encoder_output_mode: position
exposure_s: 0.00002
# q = (raw_column - center) / (width / 2); ray_x = S/(2*f) * polynomial(q).
# Monotonic raw-pixel-to-ray polynomial; asymmetric terms are supported.
ray_polynomial: [0.0, 1.0, 0.0, 0.04]
calibration_id: nominal-linescan-4k-20mm-large-v7
# Keep the entire downward scan plane ahead of the front support mounts (x < 1.10 below the optical centre).
camera_x_m: 1.15
base_nominal_height_m: 0.65
# Signed offset from camera: behind the scan plane, close to the chassis front.
led_forward_offset_m: -0.0803847577293368
led_height_m: 0.30
led_length_m: 1.20
grid_spacing_m: 0.10
grid_line_width_m: 0.002
grid_extent_m: 20.0
grid_dark: 25
grid_light: 210
# Only straight forward/backward scanning is accepted in the first prototype.
# Allow small contact-induced front/rear encoder disagreement at slab joints.
# Limit = max(absolute floor, relative * abs(mean wheel speed)); yaw gate remains independent.
wheel_speed_spread_absolute_m_s: 0.01
wheel_speed_spread_relative: 0.01
max_steer_rad: 0.02
max_yaw_rate_rad_s: 0.02
max_scan_speed_m_s: 0.25
max_sample_gap_s: 0.10

# Sensor radiometry is applied by cuda_tiles and optix (optix requires enabled); GZ spots share mounting/footprint/LED peak.
# Relative reference daylight=1; NOT calibrated lux.
# Intentionally enlarged geometric distortion above remains unchanged.
radiometry:
  enabled: true
  noise: true
  led_peak_relative: 40.0
  led_half_width_m: 0.90
  led_half_depth_m: 0.08
  ambient_relative: 1.0
  shadow_transmission: 0.1
  shadow_start_x_m: 40.0
  shadow_end_x_m: 50.0
  vignette_edge_loss: 0.15
  prnu_fraction: 0.01
  read_noise_electrons: 3.0
  # reference_irradiance_relative defaults to 41 (fixed calibration reference).
  # Increasing LED power changes brightness; the reference does not auto-normalize.
  reference_electrons: 10000.0
  full_well_electrons: 12000.0
  gain: 1.0
  black_level_dn: 4.0
  seed: 1729

# Ogre2 visual counterpart of the CUDA LED. Relative display intensity, not lux.
# Position and footprint use the same mounting/radiometry configuration above.
gz_led:
  enabled: true
  intensity_at_reference: 0.7

# Waiting queue excludes one active job and one partial GPU batch.
# 2048 lines / 22 kHz = 93 ms of arrivals; wall waiting deadline = 150 ms.
# These are explicit provisional budgets, not measured worst-case guarantees.
sampling:
  batch_rows: 256
  tile_cache_slots: 24
  queue_capacity_lines: 2048
  queue_capacity_jobs: 512
  queue_max_wait_s: 0.15
  prefetch_distance_m: 4.0

# Equivalent upper-bracket bending; selected simulation baseline, not measured hardware.
# Two physical passive axes, pitch/roll, gravity-balanced at level. Not measured hardware.
mount_flex:
  enabled: true
  stiffness_nm_rad: 150.0
  damping_nms_rad: 2.5
