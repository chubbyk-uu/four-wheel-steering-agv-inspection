# First low-speed tracking baseline; body commands still pass through swerve limits.
position_gain: 0.7
heading_gain: 0.5
feedback_filter_s: 0.6
# Along-track feedback must respond during braking; cross-track/yaw stay smooth.
longitudinal_feedback_filter_s: 0.2
longitudinal_position_gain: 1.2
position_deadband_m: 0.01
# PASS transverse feedback has no deadband; small filtered errors participate.
# Approach, terminal trim, longitudinal and heading deadbands stay independent.
scan_cross_track_deadband_m: 0.0
heading_deadband_rad: 0.004
max_position_feedback_m_s: 0.12
max_heading_feedback_rad_s: 0.06
cross_command_ratio: 0.20
position_tolerance_m: 0.05
heading_tolerance_rad: 0.025
stopped_speed_m_s: 0.025
stopped_yaw_rate_rad_s: 0.015
settle_time_s: 0.5
angular_accel_rad_s2: 0.40
angular_decel_rad_s2: 0.50
angular_speed_rad_s: 0.80
alignment_linear_probe_m_s: 0.025
alignment_angular_probe_rad_s: 0.02
feedback_age_limit_s: 0.12
wall_timeout_s: 0.35
# Any control tick whose wall time or preceding gap exceeds this is archived
# with its phase breakdown. Diagnosing a stall must not depend on it faulting.
control_stall_threshold_s: 0.05
# Cadence for archiving the per-phase peaks of the control tick.
control_phase_report_ticks: 100
# Longest step the control loop may take, measured either on the simulation
# clock or on the executor's own steady clock. A blocked executor must be named
# as such, not reported as stale localization it never got to read.
max_control_step_s: 0.1
# How long the mission may wait at its own end for the archive queue to drain and
# flush before it declares success. The vehicle is already stopped, so a tick or
# two costs nothing; a filesystem that never drains must fault rather than let the
# mission hang in RUNNING or claim evidence it never wrote.
archive_drain_timeout_s: 10.0
max_tracking_error_m: 0.6
max_heading_error_rad: 0.35
# Heading error the sensor's lateral gate is sized for, enforced while a scan
# window is open. At speed the body's lateral velocity is mostly the forward
# command projected through this angle -- 2.778 m/s at 0.05 rad is 0.139 m/s,
# more than the whole position-feedback authority -- so leaving it at the 0.35
# fault threshold would need a lateral gate of 1.07 m/s, which is three metres
# of shear across one block.
max_capture_heading_error_rad: 0.05
# Segment watchdog scales with the planned time profile: a fixed budget either
# starves a 100 m pass or lets a short one stall. The margin covers wheel
# alignment, brake waits and the terminal settle, which do not scale with length.
segment_timeout_factor: 1.5
segment_timeout_margin_s: 20.0

terminal_dwell_s: 0.4
terminal_translation_speed_m_s: 0.08
terminal_rotation_speed_rad_s: 0.06
max_terminal_trims: 3
initial_ready_hold_s: 5.0

# Resume is explicit; a moved vehicle must be replanned, not silently joined.
pause_max_displacement_m: 0.20
pause_max_rotation_rad: 0.10
pause_stop_timeout_s: 10.0

# Camera state is independent of image output cadence (including ordinary pause).
capture_state_timeout_s: 0.5
