schema: agv.rectangle.request.v1
mission_id: demo_8x4
# Rectangle and bounds are in ROAD coordinates. Map transform is map configuration.
road:
  frame_id: world
  origin_xyz_m: [0.0, 0.0, 0.0]
  yaw_rad: 0.0
  surface: flat
region:
  start_xy_m: [6.0, -2.0]
  length_m: 8.0
  width_m: 4.0
track_spacing_m: 1.0
scan_speed_m_s: 0.5
# Geometric baseline only. Set >0 for the later measured tracking uncertainty.
coverage_error_m: 0.0
# Physical usable rectangle, NOT the optical texture skirt.
drivable_bounds_xy_m: [0.0, 20.0, -5.0, 5.0]
optical_bounds_xy_m: [-1.024, 21.504, -6.144, 6.144]
# Additional distance beyond ideal acceleration/braking distances.
longitudinal_margin_m: 0.1
# Minimum time available after post-turn wheel alignment for the normal pass
# heading loop to recover before the camera reaches the inspection region.
heading_recovery_time_s: 3.0
# Conservative radius covers body, wheel sweep, camera and LED supports.
vehicle_sweep_radius_m: 1.5
sample_step_m: 0.1
